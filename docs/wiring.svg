<svg xmlns="http://www.w3.org/2000/svg" width="700" height="230" viewBox="0 0 700 230" role="img" aria-labelledby="title"><title id="title">Wiring pending exact hardware identification</title><rect width="700" height="230" fill="#101915"/><g fill="#edf3ea" font-family="sans-serif" text-anchor="middle"><text x="350" y="55" font-size="23">Wiring not assigned</text><text x="350" y="105">Confirm exact ESP32-S3 development board and IMU breakout.</text><text x="350" y="145">Then document SDA, SCL, supply voltage and common ground.</text><text x="350" y="185" font-size="13">Do not wire from a generic ESP32 pinout. No pin numbers are assumed.</text></g></svg>
