<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="300" viewBox="0 0 1000 300" role="img" aria-labelledby="title desc"><title id="title">MotionLink component flow</title><desc id="desc">IMU to ESP32 segmentation and forest, through MQTT to Windows host and foreground keys. Dashboard controls return through host and MQTT.</desc><rect width="1000" height="300" fill="#101915"/><g font-family="sans-serif" fill="#edf3ea" text-anchor="middle"><text x="500" y="38" font-size="22">MotionLink · two physical nodes</text><g stroke="#89a66c" fill="#243527"><rect x="20" y="85" width="150" height="90" rx="10"/><rect x="210" y="85" width="240" height="90" rx="10"/><rect x="490" y="85" width="150" height="90" rx="10"/><rect x="680" y="85" width="290" height="90" rx="10"/></g><text x="95" y="124">Six-axis IMU</text><text x="95" y="150" font-size="12">Hardware pending</text><text x="330" y="116">ESP32-S3</text><text x="330" y="141" font-size="13">Segment → features → forest</text><text x="330" y="161" font-size="12">Mode + session watchdog</text><text x="565" y="125">MQTT broker</text><text x="565" y="150" font-size="12">Windows laptop</text><text x="825" y="116">Windows host</text><text x="825" y="141" font-size="13">Validate → mapped key press/release</text><text x="825" y="161" font-size="12">Local dashboard + acknowledged controls</text><text x="190" y="136">→</text><text x="470" y="136">⇄</text><text x="660" y="136">⇄</text><text x="500" y="225" font-size="14">Firmware owns mode. New sessions start disarmed. Expired events cannot send keys.</text><text x="500" y="260" font-size="12">Portable core implemented · board transport and real trained model pending</text></g></svg>
